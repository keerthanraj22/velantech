version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=agriequip_connect
      - MYSQL_USER=agriequip
      - MYSQL_PASSWORD=agriequip_password
      - MYSQL_CONNECTION_LIMIT=20
      - AI_MAX_CONCURRENT_REQUESTS=8
      - AI_MAX_QUEUE_SIZE=40
      - AI_RATE_LIMIT_PER_MINUTE=20
      - JWT_SECRET=agriequip_secret_2026
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: agriequip_connect
      MYSQL_USER: agriequip
      MYSQL_PASSWORD: agriequip_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
